name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: cargame-rg
  APP_NAME: cargame
  LOCATION: westeurope

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr
        run: |
          ACR_SERVER=$(az acr show --name ${{ env.APP_NAME }}acr --resource-group ${{ env.RESOURCE_GROUP }} --query loginServer -o tsv)
          echo "server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: az acr login --name ${{ env.APP_NAME }}acr

      - name: Build and push game server
        run: |
          docker build -f Dockerfile.gameserver -t ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-gameserver:${{ github.sha }} .
          docker push ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-gameserver:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build -f Dockerfile.frontend -t ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-frontend:${{ github.sha }} .
          docker push ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-frontend:${{ github.sha }}

      - name: Deploy game server
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }}-gameserver \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-gameserver:${{ github.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }}-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ steps.acr.outputs.server }}/${{ env.APP_NAME }}-frontend:${{ github.sha }}

      - name: Get frontend URL
        run: |
          URL=$(az containerapp show --name ${{ env.APP_NAME }}-frontend --resource-group ${{ env.RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "🚀 Deployed to: https://$URL"
