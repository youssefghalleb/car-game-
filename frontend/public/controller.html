<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Race Controller</title>
  <style>
    :root {
      --bg: #080b10;
      --panel: #141922;
      --panel-2: #1c2430;
      --panel-3: #263140;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f7f9fc;
      --muted: #a9b4c4;
      --blue: #4da3ff;
      --green: #49d27f;
      --red: #ff5c5c;
      --yellow: #ffd166;
      --orange: #ff8a3d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100svh;
      min-height: 100dvh;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(77, 163, 255, 0.18), transparent 32rem),
        linear-gradient(180deg, #07090d 0%, #111721 55%, #0c1017 100%);
      overscroll-behavior: none;
    }

    body.controller-locked {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: var(--text);
      font-weight: 850;
      touch-action: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: var(--panel-2);
      outline: none;
    }

    input[type="range"] {
      min-height: 28px;
      padding: 0;
      accent-color: var(--blue);
    }

    label {
      display: grid;
      gap: 5px;
      min-width: 0;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .shell {
      width: min(100%, 1100px);
      min-height: calc(100svh - 16px);
      min-height: calc(100dvh - 16px);
      height: calc(100svh - 16px);
      height: calc(100dvh - 16px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
      overflow: hidden;
    }

    .topbar,
    .panel,
    details.debug-panel {
      background: rgba(18, 24, 33, 0.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      min-width: 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    h2 {
      font-size: 0.8rem;
      letter-spacing: 0;
      text-transform: uppercase;
      color: var(--muted);
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .status-pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--line);
      font-size: 0.78rem;
      font-weight: 850;
      white-space: nowrap;
      max-width: min(46vw, 320px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6f7a89;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    body.is-connecting .status-dot,
    body.is-reconnecting .status-dot {
      background: var(--yellow);
    }

    body.is-paired .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(73, 210, 127, 0.12);
    }

    body.is-error .status-dot,
    body.is-disconnected .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(255, 92, 92, 0.12);
    }

    .connection-grid,
    .settings-grid,
    .audio-grid,
    .command-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .connection-panel {
      padding: 10px;
    }

    .connect-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 0.8fr;
      gap: 8px;
      margin-top: 8px;
    }

    .panel {
      padding: 10px;
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    details.panel {
      display: block;
    }

    details.panel[open] {
      display: grid;
    }

    .panel-summary {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 850;
      line-height: 1;
      list-style: none;
      text-transform: uppercase;
    }

    .panel-summary::-webkit-details-marker {
      display: none;
    }

    .panel-summary::after {
      content: "+";
      width: 24px;
      height: 24px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 999px;
      color: var(--text);
      background: var(--panel-3);
    }

    details[open] > .panel-summary::after {
      content: "-";
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .main-grid::-webkit-scrollbar {
      display: none;
    }

    body.is-paired .main-grid {
      overflow: auto;
    }

    .readout-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .readout {
      min-height: 48px;
      display: grid;
      gap: 2px;
      align-content: center;
      padding: 8px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      text-align: center;
    }

    .readout span {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .readout strong {
      font-size: 1rem;
    }

    .steering-box {
      display: grid;
      grid-template-columns: minmax(88px, 116px) minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .wheel {
      width: 116px;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 10px solid #303b4c;
      background:
        radial-gradient(circle at 50% 50%, #111721 0 28%, transparent 29%),
        linear-gradient(135deg, #1f2937, #0f141d);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06), 0 12px 26px rgba(0, 0, 0, 0.3);
      position: relative;
      transform: rotate(calc(var(--steer-angle, 0) * 1deg));
      transition: transform 80ms linear;
    }

    .wheel::before,
    .wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 72px;
      border-radius: 999px;
      background: #56657a;
      transform-origin: center;
    }

    .wheel::before {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .wheel::after {
      transform: translate(-50%, -50%);
    }

    .steer-meter {
      display: grid;
      gap: 8px;
    }

    .steer-track {
      height: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #283241;
      border: 1px solid var(--line);
      position: relative;
    }

    .steer-track::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.42);
    }

    .steer-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--yellow));
    }

    .touch-steer {
      width: 100%;
    }

    .pedals {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 8px;
    }

    .secondary-pedals {
      display: grid;
      gap: 8px;
    }

    .control-btn {
      min-height: 44px;
      border-radius: 8px;
      padding: 10px;
      background: var(--panel-3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .control-btn.is-active {
      filter: brightness(1.18);
      transform: translateY(1px);
    }

    .primary {
      background: linear-gradient(180deg, #56b0ff, #2f7fd4);
    }

    .success {
      background: linear-gradient(180deg, #5be08d, #2f9d5e);
    }

    .danger {
      background: linear-gradient(180deg, #ff7272, #bd3f3f);
    }

    .warning {
      background: linear-gradient(180deg, #ffba64, #d8692a);
    }

    .throttle {
      min-height: 146px;
      font-size: 1.12rem;
      background: linear-gradient(180deg, #59e38e, #25a95b);
    }

    .brake,
    .nitro {
      min-height: 70px;
    }

    .brake {
      background: linear-gradient(180deg, #ff7474, #bc3c3c);
    }

    .nitro {
      background: linear-gradient(180deg, #ffb257, #e0722f);
    }

    .toggle-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .toggle-on {
      background: linear-gradient(180deg, #4ecf83, #2f8556);
    }

    .toggle-off {
      background: var(--panel-3);
    }

    .wizard {
      border: 1px solid rgba(77, 163, 255, 0.25);
      background: rgba(77, 163, 255, 0.07);
      border-radius: 8px;
      padding: 9px;
      display: grid;
      gap: 7px;
    }

    .wizard-copy {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    details.debug-panel {
      padding: 8px 10px;
    }

    details.debug-panel summary {
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 850;
      text-transform: uppercase;
    }

    .debug-grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .debug-grid strong {
      display: block;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .drive-panel {
      grid-template-rows: auto auto minmax(0, auto) minmax(0, 1fr);
    }

    .drive-panel h2,
    .commands-panel h2,
    .settings-panel h2,
    .audio-panel h2 {
      line-height: 1;
    }

    .drive-panel .pedals {
      min-height: 0;
    }

    @media (min-width: 720px) and (min-height: 680px) {
      .shell {
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      .connection-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .main-grid {
        grid-template-columns: minmax(360px, 1.1fr) minmax(280px, 0.9fr);
        align-items: stretch;
      }

      .drive-panel {
        grid-column: 1;
        grid-row: 1 / span 3;
      }

      .commands-panel,
      .settings-panel,
      .audio-panel {
        grid-column: 2;
      }
    }

    @media (max-width: 430px) {
      body {
        padding: 6px;
      }

      .shell {
        min-height: calc(100dvh - 12px);
        height: calc(100dvh - 12px);
        gap: 6px;
      }

      .topbar,
      .panel,
      details.debug-panel {
        border-radius: 7px;
      }

      .topbar,
      .panel {
        padding: 8px;
      }

      .status-pill {
        min-height: 30px;
        padding: 6px 8px;
      }

      .connection-grid,
      .settings-grid,
      .audio-grid,
      .command-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .steering-box {
        grid-template-columns: minmax(76px, 92px) minmax(0, 1fr);
      }

      .wheel {
        width: 92px;
        border-width: 8px;
      }

      .wheel::before,
      .wheel::after {
        height: 56px;
        width: 10px;
      }

      .throttle {
        min-height: 128px;
      }

      .brake,
      .nitro {
        min-height: 62px;
      }

      input,
      select,
      .control-btn {
        min-height: 38px;
      }
    }

    @media (max-width: 360px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .status-pill {
        max-width: 100%;
        width: 100%;
        justify-content: center;
      }

      .connection-grid,
      .settings-grid,
      .audio-grid {
        gap: 5px;
      }

      .connect-actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .command-grid {
        gap: 5px;
      }

      .connect-actions .control-btn {
        padding: 7px 5px;
        font-size: 0.76rem;
      }
    }

    @media (max-height: 760px) {
      .subtitle,
      .wizard-copy {
        display: none;
      }

      .panel {
        gap: 6px;
      }

      input,
      select,
      .control-btn {
        min-height: 34px;
        padding: 7px 8px;
        font-size: 0.82rem;
      }

      label {
        gap: 3px;
        font-size: 0.68rem;
      }

      .readout {
        min-height: 40px;
        padding: 6px;
      }

      .throttle {
        min-height: 112px;
      }

      .brake,
      .nitro {
        min-height: 54px;
      }
    }

    @media (max-height: 720px), (max-width: 390px) {
      body.is-paired .shell {
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }

      body.is-paired .main-grid {
        grid-template-rows: auto auto auto auto;
        overflow: auto;
      }

      body.is-paired .drive-panel {
        gap: 5px;
      }

      body.is-paired .readout {
        min-height: 34px;
      }

      body.is-paired .steering-box {
        grid-template-columns: minmax(72px, 84px) minmax(0, 1fr);
        gap: 7px;
      }

      body.is-paired .wheel {
        width: 84px;
        border-width: 7px;
      }

      body.is-paired .wheel::before,
      body.is-paired .wheel::after {
        width: 8px;
        height: 50px;
      }

      body.is-paired .pedals {
        gap: 6px;
      }

      body.is-paired .throttle {
        min-height: 96px;
      }

      body.is-paired .brake,
      body.is-paired .nitro {
        min-height: 48px;
      }

      body.is-paired .commands-panel {
        align-self: end;
      }

      body.is-paired .debug-panel {
        display: block;
      }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      body {
        overflow-y: auto;
      }

      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        align-items: start;
      }

      .topbar,
      .connection-panel,
      .settings-panel,
      .audio-panel {
        grid-column: auto;
      }

      .drive-panel,
      .commands-panel {
        grid-column: auto;
      }

      details.debug-panel {
        grid-column: auto;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .main-grid {
        display: grid;
        grid-template-columns: minmax(260px, 1.05fr) minmax(220px, 0.95fr);
        overflow: auto;
      }

      .drive-panel {
        grid-column: 1;
        grid-row: 1 / span 3;
      }

      .commands-panel,
      .settings-panel,
      .audio-panel {
        grid-column: 2;
      }

      .throttle {
        min-height: 110px;
      }
    }

  </style>
</head>
<body class="is-disconnected">
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Race Controller</h1>
        <p class="subtitle">Room <strong id="roomLabel">-</strong> · Player <strong id="playerLabel">-</strong></p>
      </div>
      <div class="status-pill" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">Not connected</span>
      </div>
    </section>

    <section class="panel connection-panel">
      <h2>Pairing</h2>
      <div class="connection-grid">
        <label>Room ID<input id="roomInput" autocomplete="off" autocapitalize="characters" /></label>
        <label>Player ID<input id="playerInput" autocomplete="off" autocapitalize="characters" /></label>
        <label>Player Name<input id="nameInput" autocomplete="off" maxlength="20" /></label>
        <label>Mode
          <select id="modeSelect">
            <option value="tilt">Tilt steering</option>
            <option value="touch">Touch steering</option>
          </select>
        </label>
      </div>
      <div class="connect-actions">
        <button id="connectBtn" class="control-btn primary">Connect</button>
        <button id="enableMotionBtn" class="control-btn primary">Motion</button>
        <button id="disconnectBtn" class="control-btn">Disconnect</button>
      </div>
    </section>

    <div class="main-grid">
      <section class="panel drive-panel">
        <h2>Drive</h2>
        <div class="readout-row">
          <div class="readout"><span>Steer</span><strong id="steerValue">0.00</strong></div>
          <div class="readout"><span>Speed</span><strong id="speedValue">0</strong></div>
          <div class="readout"><span>Health</span><strong id="healthValue">-</strong></div>
        </div>

        <div class="steering-box">
          <div id="wheel" class="wheel" aria-hidden="true"></div>
          <div class="steer-meter">
            <div class="steer-track"><div id="steerFill" class="steer-fill"></div></div>
            <input id="touchSteerSlider" class="touch-steer" type="range" min="-100" max="100" value="0" />
          </div>
        </div>

        <div class="pedals">
          <button id="throttleBtn" class="control-btn throttle">Throttle</button>
          <div class="secondary-pedals">
            <button id="brakeBtn" class="control-btn brake">Brake</button>
            <button id="nitroBtn" class="control-btn nitro">Nitro</button>
          </div>
        </div>
      </section>

      <section class="panel commands-panel">
        <h2>Game</h2>
        <div class="command-grid">
          <button id="readyBtn" class="control-btn success">Ready</button>
          <button id="respawnBtn" class="control-btn warning">Respawn</button>
          <button id="pauseBtn" class="control-btn">Pause</button>
          <button id="resumeBtn" class="control-btn">Resume</button>
          <button id="restartBtn" class="control-btn">Restart</button>
          <button id="quitBtn" class="control-btn danger">Quit</button>
        </div>
      </section>

      <details class="panel settings-panel">
        <summary class="panel-summary">Sensors / motion</summary>
        <div class="settings-grid">
          <label>Axis
            <select id="axisSelect">
              <option value="gamma">Gamma</option>
              <option value="beta">Beta</option>
              <option value="alpha">Alpha</option>
            </select>
          </label>
          <label>Smoothing<input id="smoothingSlider" type="range" min="0" max="90" value="35" /></label>
          <label>Sensitivity<input id="sensitivitySlider" type="range" min="50" max="180" value="100" /></label>
          <label>Dead Zone<input id="deadzoneSlider" type="range" min="0" max="18" value="6" /></label>
        </div>
        <div class="toggle-row">
          <button id="invertBtn" class="control-btn toggle-on">Invert: On</button>
        </div>
        <div class="wizard">
          <div id="wizardText" class="wizard-copy">Calibration: hold centered, then capture left and right tilt.</div>
          <div class="toggle-row">
            <button id="calibrateWizardBtn" class="control-btn primary">Start Calibration</button>
            <button id="resetCalibrationBtn" class="control-btn">Reset Calibration</button>
          </div>
        </div>
      </details>

      <details class="panel audio-panel">
        <summary class="panel-summary">Audio / vibration</summary>
        <div class="audio-grid">
          <button id="muteBtn" class="control-btn">Mute</button>
          <button id="sfxBtn" class="control-btn toggle-on">Effects: On</button>
          <label>Volume<input id="volumeSlider" type="range" min="0" max="100" value="80" /></label>
          <button id="testVibrationBtn" class="control-btn">Test Vibration</button>
        </div>
      </details>
    </div>

    <details id="debugPanel" class="debug-panel">
      <summary>Debug panel</summary>
      <div class="debug-grid">
        <div>Room<strong id="debugRoom">-</strong></div>
        <div>Player<strong id="debugPlayer">-</strong></div>
        <div>Status<strong id="debugStatus">disconnected</strong></div>
        <div>Ping<strong id="debugPing">-</strong></div>
        <div>Steer<strong id="debugSteer">0.00</strong></div>
        <div>Pedals<strong id="debugPedals">idle</strong></div>
        <div>Last input<strong id="debugLastInput">-</strong></div>
        <div>Socket<strong id="debugSocket">none</strong></div>
      </div>
    </details>
  </main>

  <script src="/js/controller.js"></script>
</body>
</html>
