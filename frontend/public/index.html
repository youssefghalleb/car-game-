<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Game - Multiplayer</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Lobby screen -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-container">
      <h1>🏎️ Car Race</h1>
      <div class="lobby-card">
        <label for="player-name">Your Name</label>
        <input type="text" id="player-name" maxlength="20" placeholder="Enter name..." value="Player" />
      </div>
      <div class="lobby-card">
        <label for="room-code">Room Code</label>
        <input type="text" id="room-code" maxlength="10" placeholder="Leave empty for new room" />
      </div>
      <div class="lobby-card settings-grid">
        <div>
          <label for="mode-select">Mode</label>
          <select id="mode-select">
            <option value="sprint" selected>Sprint</option>
            <option value="time_trial">Time Trial</option>
            <option value="practice">Practice</option>
            <option value="elimination">Elimination</option>
          </select>
        </div>
        <div>
          <label for="track-select">Track</label>
          <select id="track-select">
            <option value="track_1">Circuit 1</option>
            <option value="track_2">Circuit 2</option>
          </select>
        </div>
        <div>
          <label for="laps-select">Laps</label>
          <select id="laps-select">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
          </select>
        </div>
        <div>
          <label for="bots-select">Bots</label>
          <select id="bots-select">
            <option value="0">0</option>
            <option value="2" selected>2</option>
            <option value="4">4</option>
          </select>
        </div>
        <div>
          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="expert">Expert</option>
          </select>
        </div>
        <div>
          <label for="damage-select">Damage</label>
          <select id="damage-select">
            <option value="true" selected>On</option>
            <option value="false">Off</option>
          </select>
        </div>
        <div>
          <label for="assist-select">Steering</label>
          <select id="assist-select">
            <option value="none" selected>Direct</option>
            <option value="medium">Assist</option>
            <option value="full">Stable</option>
          </select>
        </div>
      </div>
      <div id="players-list" class="lobby-card">
        <h3>Room Overview</h3>
        <div id="room-overview" class="room-overview">
          <span>Room <strong id="overview-room">-</strong></span>
          <span>Players <strong id="overview-players">0</strong></span>
          <span>Spectators <strong id="overview-spectators">0</strong></span>
          <span>Mode <strong id="overview-mode">Sprint</strong></span>
          <span>Track <strong id="overview-track">Circuit 1</strong></span>
        </div>
        <h3>Players</h3>
        <ul id="player-list-ul"></ul>
      </div>
      <div id="records-card" class="lobby-card records-card">
        <h3>Personal Records</h3>
        <div id="records-summary" class="records-summary"></div>
      </div>
      <div id="chat-card" class="lobby-card chat-card">
        <h3>Room Chat</h3>
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-row">
          <input type="text" id="chat-input" maxlength="160" placeholder="Message..." />
          <button id="chat-send-btn" class="btn compact">Send</button>
        </div>
      </div>
      <div id="pairing-card" class="lobby-card pairing-card hidden">
        <div>
          <h3>Controller Pairing</h3>
          <p class="pairing-meta">Room <strong id="pair-room">-</strong> · Player <strong id="pair-player">-</strong></p>
          <a id="controller-link" href="#" target="_blank" rel="noreferrer">Open controller</a>
        </div>
        <img id="pair-qr" alt="Controller QR code" />
      </div>
      <button id="join-btn" class="btn primary">Join Game</button>
      <button id="spectate-btn" class="btn">Spectate</button>
      <button id="ready-btn" class="btn hidden">Ready</button>
      <button id="start-btn" class="btn success hidden">Start Race</button>
      <div id="lobby-status" class="status-msg"></div>
    </div>
  </div>

  <!-- Game screen -->
  <div id="game-screen" class="screen">
    <canvas id="game-canvas"></canvas>
    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-position" class="hud-item">P1</div>
      <div id="hud-lap" class="hud-item">Lap 1/5</div>
      <div id="hud-speed" class="hud-item">0 km/h</div>
      <div id="hud-time" class="hud-item">0.00s</div>
      <div id="hud-nitro" class="hud-bar">
        <div id="hud-nitro-fill" class="bar-fill nitro-fill"></div>
      </div>
      <div id="hud-health" class="hud-bar">
        <div id="hud-health-fill" class="bar-fill health-fill"></div>
      </div>
    </div>
    <div id="race-panel">
      <div class="panel-title">Leaderboard</div>
      <ol id="leaderboard-list"></ol>
    </div>
    <div id="race-controls">
      <button id="pause-race-btn" class="btn compact">Pause</button>
      <button id="resume-race-btn" class="btn compact">Resume</button>
      <button id="restart-race-btn" class="btn compact">Restart</button>
      <button id="reset-race-btn" class="btn compact">Reset</button>
      <button id="quit-race-btn" class="btn compact danger">Quit</button>
      <button id="ghost-toggle-btn" class="btn compact">Ghost On</button>
      <button id="mute-audio-btn" class="btn compact">Mute</button>
      <label for="volume-slider" class="volume-control">Volume</label>
      <input id="volume-slider" type="range" min="0" max="100" value="100" />
      <label for="effects-volume-slider" class="volume-control">FX</label>
      <input id="effects-volume-slider" type="range" min="0" max="100" value="100" />
      <select id="sound-quality-select" class="compact-select">
        <option value="high" selected>Hi-Fi</option>
        <option value="low">Lite</option>
      </select>
    </div>
    <div id="minimap-panel">
      <canvas id="minimap-canvas" width="220" height="140"></canvas>
    </div>
    <div id="race-warning" class="hidden"></div>
    <!-- Countdown overlay -->
    <div id="countdown-overlay" class="hidden">
      <span id="countdown-text">3</span>
    </div>
    <!-- Results overlay -->
    <div id="results-overlay" class="hidden">
      <h2>Race Finished!</h2>
      <ol id="results-list"></ol>
      <button id="back-to-lobby-btn" class="btn primary">Back to Lobby</button>
    </div>
  </div>

  <!-- Mobile controls (touch) -->
  <div id="mobile-controls" class="hidden">
    <button id="touch-throttle" class="touch-btn throttle-btn">GAS</button>
    <button id="touch-brake" class="touch-btn brake-btn">BRAKE</button>
    <button id="touch-nitro" class="touch-btn nitro-btn">N₂O</button>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
